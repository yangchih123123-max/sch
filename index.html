<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>計程車排班</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#14171a;--mut:#667085;--line:#e4e7ec;--pri:#1565c0;--ok:#168a4a;--warn:#d97706;--bad:#c62828;--vio:#6d3fc0;--gray:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#1a1f26;--tx:#eef1f5;--mut:#9aa4b2;--line:#2b323c;--pri:#3b82d6;--ok:#22a45d;--warn:#d98a14;--bad:#e05555;--vio:#8a63d8;--gray:#5b6573}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.center{text-align:center}.mut{color:var(--mut)}.sm{font-size:14px}.warn{color:var(--warn);font-weight:600}
.code{font-size:64px;font-weight:800;line-height:1.05;letter-spacing:1px}
.nextcode{font-size:76px;font-weight:800;line-height:1.05;text-align:center;margin:4px 0}
.fare{font-size:68px;font-weight:800;text-align:center;line-height:1.1;margin:6px 0}
.chip{display:inline-block;color:#fff;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:600;background:var(--gray)}
.chip[data-s="待命"]{background:var(--ok)}.chip[data-s="出發載客"]{background:var(--warn)}
.chip[data-s="載客中"]{background:var(--pri)}.chip[data-s="空車返回"]{background:var(--vio)}
.btn{display:block;width:100%;padding:16px 10px;border:0;border-radius:12px;font-size:19px;font-weight:700;background:var(--pri);color:#fff;font-family:inherit}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.vio{background:var(--vio)}.btn.bad{background:var(--bad)}.btn.gray{background:var(--gray)}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn:disabled{opacity:.3}.btn+.btn{margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .btn+.btn{margin-top:0}
.span2{grid-column:1/3}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:18px;background:var(--bg);color:var(--tx);font-family:inherit;margin:6px 0}
label{display:block;margin:6px 0}label input[type=checkbox]{width:auto;margin-right:8px;transform:scale(1.3)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filters select{width:auto;flex:1}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rc{font-size:30px;font-weight:800;min-width:64px;text-align:center}.rm{flex:1}
.tr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:16px 0;border:0;background:none;font-size:17px;font-weight:700;color:var(--mut);font-family:inherit}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:22px}
details{margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px}summary{font-weight:700;padding:6px 0}
#busy{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;align-items:center;justify-content:center}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid #fff;border-top-color:transparent;animation:r 0.8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:12px;padding:13px 16px;z-index:40;display:none;text-align:center;font-weight:600}
#toast.err{background:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="view"><div class="card center">載入中…</div></div>
<nav id="nav" style="display:none">
  <button data-tab="home">狀態</button><button data-tab="board">看板</button><button data-tab="today">今日</button>
</nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="busy"><div class="spin"></div></div>
<div id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ====== 部署時只需要改這兩行 ====== */
const LIFF_ID = '2012264542-7Drlq8kz';
const API_URL = 'https://script.google.com/macros/s/AKfycbyLhHmCBetwYr4TEedwA5PKjcqjbyE5OeNkunQahDLq/dev';
/* ================================== */

let ME = null, ROUTES = [], TAB = 'home', BOARD = null, TODAY = null, TODAYDATE = '', ALL = false, tick = 0;
let FILTER = { nosmoke: false, minSeats: 0 };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 共用 ---------- */
function busy(on) { $('#busy').style.display = on ? 'flex' : 'none'; }
let toastT;
function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', err ? 4500 : 2200);
}
function modal(html) { $('#sheet').innerHTML = html; $('#modal').style.display = 'flex'; }
function closeModal() {
  $('#modal').style.display = 'none';
  if (TAB === 'today') loadToday(true); else if (TAB === 'home') refreshMe(); else loadBoard(true);
}
async function call(action, data, quiet) {
  if (!quiet) busy(true);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ idToken: liff.getIDToken(), action }, data || {})) });
    const j = await r.json();
    if (!j.ok) {
      if (/驗證失敗/.test(j.error)) { try { liff.logout(); liff.login({ redirectUri: location.href }); } catch (e) {} }
      throw new Error(j.error);
    }
    return j.data;
  } finally { if (!quiet) busy(false); }
}
function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => res(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 15000 });
  });
}
function navUrl(text) {
  text = String(text || '').trim();
  if (/^https?:\/\//i.test(text)) return text;
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(text);
}
function openNav(text) { try { liff.openWindow({ url: navUrl(text), external: true }); } catch (e) { window.open(navUrl(text), '_blank'); } }
function getAction() {
  const p = new URLSearchParams(location.search);
  let a = p.get('a');
  if (!a && p.get('liff.state')) {
    try { a = new URLSearchParams(p.get('liff.state').replace(/^\//, '').replace(/^\?/, '')).get('a'); } catch (e) {}
  }
  return a;
}

/* ---------- 啟動 ---------- */
async function boot() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const r = await call('me');
    if (r.bound === false) { showBind(); return; }
    ME = r.me; ROUTES = r.routes || [];
    const a = getAction();
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    $('#nav').style.display = 'flex';
    setTab('home', true);
    if (a) await runAction(a);
  } catch (e) {
    $('#view').innerHTML = '<div class="card center"><b>無法載入</b><p class="mut">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">重新載入</button></div>';
  }
}
function showBind() {
  $('#view').innerHTML = `<div class="card"><h2 style="margin-top:0">第一次使用：綁定代號</h2>
    <p class="mut">請輸入你的司機代號與管理員給你的綁定碼。</p>
    <input id="bCode" placeholder="代號（例如 07）" autocomplete="off">
    <input id="bPin" placeholder="綁定碼" inputmode="numeric" autocomplete="off">
    <button class="btn" onclick="doBind()">綁定</button></div>`;
}
async function doBind() {
  try {
    await call('bind', { code: $('#bCode').value, pin: $('#bPin').value });
    location.reload();
  } catch (e) { toast(e.message, true); }
}
async function runAction(a) {
  if (a === 'onduty' || a === 'standby' || a === 'offduty') return doStatus(a);
  if (a === 'pickup') return doPickup();
  if (a === 'dropoff') return doDropoff();
  if (a === 'cancel') return doCancel();
  if (a === 'board' || a === 'dispatch') return setTab('board');
  if (a === 'today') return setTab('today');
}

/* ---------- 分頁 ---------- */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
function setTab(t, noLoad) {
  TAB = t;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  window.scrollTo(0, 0);
  if (t === 'home') { renderHome(); if (!noLoad) refreshMe(); }
  else if (t === 'board') { buildBoard(); loadBoard(); }
  else { buildToday(); loadToday(); }
}
async function refreshMe() {
  try { const r = await call('me', {}, true); ME = r.me; ROUTES = r.routes || ROUTES; if (TAB === 'home') renderHome(); } catch (e) {}
}

/* ---------- 首頁（司機狀態） ---------- */
function renderHome() {
  const m = ME, s = m.status;
  const can = {
    onduty: s === '下班',
    standby: s === '下班' || s === '上班' || s === '空車返回',
    pickup: s === '出發載客' || s === '待命' || s === '空車返回' || s === '上班',
    dropoff: s === '載客中',
    cancel: s === '出發載客',
    offduty: s === '上班' || s === '待命' || s === '空車返回'
  };
  let info = m.mins + ' 分鐘';
  if (s === '待命') info = m.rank ? `排隊第 <b>${m.rank}</b> 位（共 ${m.queueSize} 台待命）・已等 ${m.mins} 分` : info;
  let tripCard = '';
  if (m.trip && (s === '出發載客' || s === '載客中')) {
    const p = m.trip.pickupText;
    tripCard = `<div class="card"><div class="mut sm">客人上車地點</div>
      <div style="font-size:21px;font-weight:700;margin:4px 0 10px">${p ? esc(p) : '（總機以 Zello 語音通知）'}</div>
      ${p ? '<button class="btn" onclick="openNav(ME.trip.pickupText)">Google Maps 導航</button>' : ''}</div>`;
  }
  $('#view').innerHTML = `
    <div class="card center"><div class="code">${esc(m.code)}</div><div class="mut">${esc(m.name || '')}</div>
      <div style="margin-top:8px"><span class="chip" data-s="${esc(s)}">${esc(s)}</span></div>
      <div style="margin-top:8px">${info}</div></div>
    ${tripCard}
    <div class="grid">
      <button class="btn gray" ${can.onduty ? '' : 'disabled'} onclick="doStatus('onduty')">上班</button>
      <button class="btn ok" ${can.standby ? '' : 'disabled'} onclick="doStatus('standby')">到等候室<br>待命</button>
      <button class="btn" ${can.pickup ? '' : 'disabled'} onclick="doPickup()">客人上車<br>載客中</button>
      <button class="btn vio" ${can.dropoff ? '' : 'disabled'} onclick="doDropoff()">客人下車<br>空車返回</button>
      ${can.cancel ? '<button class="btn warn span2" onclick="doCancel()">取消派車（客人沒上車）</button>' : ''}
      <button class="btn ghost span2" ${can.offduty ? '' : 'disabled'} onclick="doStatus('offduty')">下班</button>
    </div>`;
}

async function doStatus(a) {
  if (a === 'offduty' && !confirm('確定要下班嗎？')) return;
  try {
    const r = await call(a); ME = r.me; setTab('home', true);
    if (a === 'offduty') summaryModal(r.summary); else toast('已更新：' + ME.status);
  } catch (e) { toast(e.message, true); }
}
async function doCancel() {
  if (!confirm('取消這次派車，回到原本排隊位置？')) return;
  try { const r = await call('cancel'); ME = r.me; setTab('home', true); toast('已取消，回到待命'); } catch (e) { toast(e.message, true); }
}
async function doPickup() {
  try {
    busy(true); const pos = await getPos(); busy(false);
    const r = await call('pickup', pos || {});
    ME = r.me; setTab('home', true);
    const t = r.trip || {};
    modal(`<h2>✔ 已記錄上車</h2><div class="mut">${esc(t.pickupTime || '')}・${pos ? 'GPS 已定位' : '<span class="warn">沒抓到 GPS</span>（可用下方里程表）'}</div>
      <label class="mut" style="margin-top:12px">里程表起點（選填）</label>
      <input id="odo1" type="number" inputmode="decimal" placeholder="例如 123456">
      <button class="btn ghost" onclick="saveOdo1('${esc(t.id)}')">儲存起點里程</button>
      <button class="btn" onclick="closeModal()">完成</button>`);
  } catch (e) { toast(e.message, true); }
}
async function saveOdo1(id) {
  const v = $('#odo1').value; if (!v) return closeModal();
  try { await call('updateTrip', { tripId: id, odoStart: v }); toast('已儲存起點里程'); closeModal(); } catch (e) { toast(e.message, true); }
}
async function doDropoff() {
  try {
    busy(true); const pos = await getPos(); busy(false);
    const r = await call('dropoff', pos || {});
    ME = r.me; setTab('home', true);
    fareModal(r.trip, '車資');
  } catch (e) { toast(e.message, true); }
}

/* ---------- 車資彈窗 ---------- */
function fareModal(t, title) {
  const has = t.fare !== '' && t.fare != null;
  const opts = '<option value="">（不使用）</option>' + ROUTES.map(r => `<option value="${esc(r.name)}" ${t.route === r.name ? 'selected' : ''}>${esc(r.name)}（$${esc(r.fare)}）</option>`).join('');
  modal(`<div class="mut center">${esc(title || '車資')}　${esc(t.pickupTime || '--')} → ${esc(t.dropTime || '--')}</div>
    <div class="fare">${has ? '$' + esc(t.fare) : '待補'}</div>
    <div class="mut center">${t.km !== '' && t.km != null ? esc(t.km) + ' 公里・' : ''}${esc(t.method || '')}</div>
    ${has ? '' : '<p class="warn center">沒有足夠資料算車資，請展開下方補里程表或輸入金額</p>'}
    <details ${has ? '' : 'open'}><summary>修正／補資料</summary>
      <label class="mut">常用路線（有固定車資）</label><select id="fxRoute">${opts}</select>
      <label class="mut">里程表 起點／終點（改用里程表計算）</label>
      <div class="grid"><input id="fxO1" type="number" inputmode="decimal" placeholder="起點" value="${esc(t.odoStart)}"><input id="fxO2" type="number" inputmode="decimal" placeholder="終點" value="${esc(t.odoEnd)}"></div>
      <label class="mut">實收金額（直接指定）</label>
      <input id="fxFare" type="number" inputmode="numeric" placeholder="例如 180">
      <button class="btn ghost" onclick="applyFix('${esc(t.id)}')">更新車資</button>
    </details>
    <button class="btn" onclick="closeModal()">完成</button>`);
}
async function applyFix(id) {
  const d = { tripId: id, route: $('#fxRoute').value };
  const o1 = $('#fxO1').value, o2 = $('#fxO2').value, f = $('#fxFare').value;
  if (o1) d.odoStart = o1; if (o2) d.odoEnd = o2;
  if (o1 && o2) d.method = 'odo';
  if (f) d.fare = f;
  try { const r = await call('updateTrip', d); ME = r.me; fareModal(r.trip, '已更新'); } catch (e) { toast(e.message, true); }
}
function summaryModal(s) {
  modal(`<h2>今日結算</h2><div class="mut">${esc(s.date)}</div><div class="fare">$${esc(s.income)}</div>
    <div class="mut center">${esc(s.count)} 趟・${esc(s.km)} 公里</div>
    ${s.pending ? `<p class="warn center">有 ${s.pending} 趟還沒算出車資，請到「今日」補資料</p>` : ''}
    <button class="btn" style="margin-top:12px" onclick="closeModal()">關閉</button>`);
}

/* ---------- 看板 ---------- */
function buildBoard() {
  const dp = ME.isDispatcher ? `<div class="card">
      <div class="mut center">下一位</div><div class="nextcode" id="nextBox">—</div><div class="mut center" id="nextInfo"></div>
      <div class="filters"><label><input type="checkbox" id="fNo" ${FILTER.nosmoke ? 'checked' : ''}>無菸車</label>
        <select id="fSeats"><option value="0">座位不限</option><option value="5">5 人以上</option><option value="6">6 人以上</option><option value="7">7 人以上</option></select></div>
      <input id="pickup" placeholder="上車地點／貼上地圖連結（選填）">
      <button class="btn ok" onclick="doDispatch()">派車給下一位</button></div>` : '';
  $('#view').innerHTML = dp + '<div class="mut sm" id="counts" style="margin:0 4px 8px"></div><div id="rows"></div>';
  if (ME.isDispatcher) {
    $('#fSeats').value = String(FILTER.minSeats);
    $('#fNo').onchange = e => { FILTER.nosmoke = e.target.checked; loadBoard(true); };
    $('#fSeats').onchange = e => { FILTER.minSeats = Number(e.target.value); loadBoard(true); };
  }
  $('#rows').onclick = e => {
    const r = e.target.closest('.row'); if (r && ME.isDispatcher) rowMenu(r.dataset.code);
  };
  if (BOARD) updateBoard();
}
async function loadBoard(quiet) {
  try { BOARD = await call('board', { filter: FILTER }, quiet); ME = BOARD.me; if (TAB === 'board') updateBoard(); }
  catch (e) { if (!quiet) toast(e.message, true); }
}
function updateBoard() {
  const b = BOARD; if (!b || !$('#rows')) return;
  if ($('#nextBox')) {
    $('#nextBox').textContent = b.next ? b.next.code : '—';
    $('#nextInfo').textContent = b.next ? [b.next.name, b.next.model, b.next.seats ? b.next.seats + '人座' : '', b.next.nosmoke ? '無菸' : ''].filter(Boolean).join('・') : '目前沒有符合條件的待命司機';
  }
  const c = b.counts || {};
  $('#counts').textContent = ['待命', '出發載客', '載客中', '空車返回', '上班', '下班'].map(k => k + ' ' + (c[k] || 0)).join('　');
  $('#rows').innerHTML = b.drivers.filter(d => d.status !== '下班').map(d =>
    `<div class="row" data-code="${esc(d.code)}"><div class="rc">${esc(d.code)}</div><div class="rm">
      <span class="chip" data-s="${esc(d.status)}">${esc(d.status)}${d.rank ? ' #' + d.rank : ''}</span> <span class="mut">${d.mins} 分</span>
      <div class="mut sm">${esc(d.model || '')}${d.seats ? '・' + esc(d.seats) + '人' : ''}${d.nosmoke ? '・無菸' : ''}${d.attrs ? '・' + esc(d.attrs) : ''}</div></div></div>`).join('')
    || '<div class="card center mut">目前沒有司機在線</div>';
}
async function doDispatch(code) {
  try {
    if (code && !confirm('指定派給代號 ' + code + '（跳過排隊順序）？')) return;
    const r = await call('dispatch', { code: code || '', pickup: ($('#pickup') || {}).value || '', filter: FILTER });
    const d = r.dispatched;
    if ($('#pickup')) $('#pickup').value = '';
    modal(`<h2>請用 Zello 通知</h2><div class="nextcode">${esc(d.code)}</div>
      <div class="mut center">${esc([d.name, d.model, d.seats ? d.seats + '人座' : '', d.nosmoke ? '無菸' : ''].filter(Boolean).join('・'))}</div>
      ${d.pickup ? `<p style="font-size:20px;font-weight:700">${esc(d.pickup)}</p>` : ''}
      <button class="btn" onclick="closeModal()">好</button>`);
  } catch (e) { toast(e.message, true); }
}
function rowMenu(code) {
  const d = BOARD.drivers.find(x => x.code === code); if (!d) return;
  modal(`<h2>代號 ${esc(code)}　<span class="chip" data-s="${esc(d.status)}">${esc(d.status)}</span></h2>
    ${d.status === '待命' ? `<button class="btn ok" onclick="closeModalQuiet();doDispatch('${esc(code)}')">指定派這位</button>` : ''}
    <button class="btn ghost" onclick="override('${esc(code)}','待命')">改為「待命」（重新排到最後）</button>
    <button class="btn ghost" onclick="override('${esc(code)}','空車返回')">改為「空車返回」</button>
    <button class="btn ghost" onclick="override('${esc(code)}','下班')">改為「下班」</button>
    <button class="btn gray" onclick="closeModal()">關閉</button>`);
}
function closeModalQuiet() { $('#modal').style.display = 'none'; }
async function override(code, status) {
  try { await call('override', { code, status }); toast('代號 ' + code + ' 已改為 ' + status); closeModal(); } catch (e) { toast(e.message, true); }
}

/* ---------- 今日 ---------- */
function buildToday() {
  $('#view').innerHTML = `<div class="card"><input type="date" id="tDate" value="${esc(TODAYDATE)}">
    ${ME.isDispatcher ? `<label><input type="checkbox" id="tAll" ${ALL ? 'checked' : ''}>全體司機彙總</label>` : ''}</div><div id="todayBody"></div>`;
  $('#tDate').onchange = e => { TODAYDATE = e.target.value; loadToday(); };
  if ($('#tAll')) $('#tAll').onchange = e => { ALL = e.target.checked; loadToday(); };
}
async function loadToday(quiet) {
  try {
    TODAY = await call('today', { date: TODAYDATE, all: ALL }, quiet); ME = TODAY.me;
    TODAYDATE = TODAY.date || (TODAY.summary && TODAY.summary.date) || TODAYDATE;
    if (TAB !== 'today' || !$('#todayBody')) return;
    $('#tDate').value = TODAYDATE;
    if (TODAY.all) {
      const t = TODAY.total;
      $('#todayBody').innerHTML = `<div class="card center"><div class="mut">全體</div><div class="fare">$${t.income}</div><div class="mut">${t.count} 趟・${t.km} 公里</div></div>
        <div class="card">${TODAY.all.map(r => `<div class="tr"><div><b style="font-size:22px">${esc(r.code)}</b> <span class="mut">${esc(r.name)}</span></div><div style="text-align:right"><b>$${r.income}</b><div class="mut sm">${r.count} 趟・${r.km} km${r.pending ? '・<span class="warn">待補 ' + r.pending + '</span>' : ''}</div></div></div>`).join('') || '<div class="center mut">這天沒有行程</div>'}</div>`;
      return;
    }
    const s = TODAY.summary;
    $('#todayBody').innerHTML = `<div class="card center"><div class="mut">${esc(ME.code)} 號　收入</div><div class="fare">$${s.income}</div>
      <div class="mut">${s.count} 趟・${s.km} 公里</div>${s.pending ? `<div class="warn" style="margin-top:6px">有 ${s.pending} 趟待補資料</div>` : ''}</div>
      <div class="card">${s.trips.map((t, i) => `<div class="tr"><div><b>${esc(t.dropTime)}</b> <span class="mut sm">${esc(t.route || (t.km !== '' ? t.km + ' km' : ''))}</span></div>
        <div>${t.fare !== '' && t.fare != null ? '<b>$' + esc(t.fare) + '</b>' : '<span class="warn">待補</span>'} <button class="chip" style="border:0" onclick="editTrip(${i})">編輯</button></div></div>`).join('') || '<div class="center mut">這天沒有行程</div>'}</div>`;
  } catch (e) { if (!quiet) toast(e.message, true); }
}
function editTrip(i) { fareModal(TODAY.summary.trips[i], '修改行程'); }

/* ---------- 定時更新（只在畫面開著時） ---------- */
setInterval(() => {
  if (document.hidden || !ME) return; tick++;
  if (TAB === 'board') { if (ME.isDispatcher || tick % 2 === 0) loadBoard(true); }
  else if (TAB === 'home' && tick % 3 === 0 && $('#modal').style.display !== 'flex') refreshMe();
}, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !ME || $('#modal').style.display === 'flex') return;
  if (TAB === 'board') loadBoard(true); else if (TAB === 'home') refreshMe();
});

boot();
</script>
</body>
</html>
